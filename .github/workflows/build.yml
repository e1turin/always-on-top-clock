name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout gpui-clock-widget
        uses: actions/checkout@v4
        with:
          path: gpui-clock-widget

      - name: Checkout Zed
        uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: main
          path: zed
          fetch-depth: 1

      - name: Resolve Zed commit
        id: zed_sha
        run: echo "sha=$(git -C zed rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get Rust version
        id: rustc_version
        run: echo "version=$(rustc -vV | awk '/^release:/{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('gpui-clock-widget/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build app bundles
        working-directory: gpui-clock-widget
        run: python3 build-apps.py

      - name: Zip apps
        working-directory: gpui-clock-widget/target/apps
        run: |
          for app in *.app; do
            ditto -c -k --sequesterRsrc --keepParent "$app" "${app%.app}.zip"
          done

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Upload app zips
        uses: actions/upload-artifact@v4
        with:
          name: apps
          path: gpui-clock-widget/target/apps/*.zip
          if-no-files-found: error
