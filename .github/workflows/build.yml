name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout pip-clock
        uses: actions/checkout@v4
        with:
          path: playground/pip-clock

      - name: Checkout Zed
        uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: main
          path: zed
          fetch-depth: 1

      - name: Resolve Zed commit
        id: zed_sha
        run: echo "sha=$(git -C zed rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get Rust version
        id: rustc_version
        run: echo "version=$(rustc -vV | awk '/^release:/{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('playground/pip-clock/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: playground/pip-clock/target
          key: target-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc_version.outputs.version }}-${{ steps.zed_sha.outputs.sha }}
          restore-keys: |
            target-${{ runner.os }}-${{ runner.arch }}-

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        working-directory: playground/pip-clock
        run: cargo build --release

      - name: Create app bundles
        working-directory: playground/pip-clock
        run: ./build-apps.sh

      - name: Zip apps
        working-directory: playground/pip-clock/target/apps
        run: |
          for app in *.app; do
            ditto -c -k --sequesterRsrc --keepParent "$app" "${app%.app}.zip"
          done

      - name: Upload app zips
        uses: actions/upload-artifact@v4
        with:
          name: apps
          path: playground/pip-clock/target/apps/*.zip
          if-no-files-found: error
