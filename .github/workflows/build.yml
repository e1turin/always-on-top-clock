name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout pip-clock
        uses: actions/checkout@v4
        with:
          path: playground/pip-clock

      - name: Checkout Zed
        uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: main
          path: zed
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        working-directory: playground/pip-clock
        run: cargo build --release

      - name: Create app bundles
        working-directory: playground/pip-clock
        run: ./build-apps.sh

      - name: Zip apps
        working-directory: playground/pip-clock/target/apps
        run: |
          for app in *.app; do
            zip -r "${app%.app}.zip" "$app"
          done

      - name: Upload app zips
        uses: actions/upload-artifact@v4
        with:
          name: apps
          path: playground/pip-clock/target/apps/*.zip
          if-no-files-found: error
