name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS apps
    runs-on: macos-14
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout gpui-clock-widget
        uses: actions/checkout@v4
        with:
          path: gpui-clock-widget


      - name: Get Rust version
        id: rustc_version
        run: echo "version=$(rustc -vV | awk '/^release:/{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('gpui-clock-widget/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build app bundles
        working-directory: gpui-clock-widget
        run: python3 build-apps.py

      - name: Zip apps
        working-directory: gpui-clock-widget/target/apps
        run: |
          for app in *.app; do
            ditto -c -k --sequesterRsrc --keepParent "$app" "${app%.app}.zip"
          done

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Upload macOS app zips
        uses: actions/upload-artifact@v4
        with:
          name: apps
          path: gpui-clock-widget/target/apps/*.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows apps
    runs-on: windows-2022
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout gpui-clock-widget
        uses: actions/checkout@v4
        with:
          path: gpui-clock-widget

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('gpui-clock-widget/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Build Windows archives
        working-directory: gpui-clock-widget
        run: python build-windows.py

      - name: Upload Windows app zips
        uses: actions/upload-artifact@v4
        with:
          name: windows-apps
          path: gpui-clock-widget/target/windows-apps/*-Windows.zip
          if-no-files-found: error
