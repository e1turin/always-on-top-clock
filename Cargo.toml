[package]
name = "gpui-clock-widget"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[[bin]]
name = "clock"
path = "src/bin/clock.rs"

[[bin]]
name = "vertical"
path = "src/bin/vertical.rs"

[[bin]]
name = "pomodoro"
path = "src/bin/pomodoro.rs"

[[bin]]
name = "stopwatch"
path = "src/bin/stopwatch.rs"

[features]
default = []
light-theme = []

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "56b1e79a5565164cd118ca6007243ea4c047f000", features = ["font-kit"] }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "56b1e79a5565164cd118ca6007243ea4c047f000", features = ["font-kit"] }
chrono = "0.4"
anyhow = "1.0"
gpui_shared_string = { git = "https://github.com/zed-industries/zed.git", rev = "56b1e79a5565164cd118ca6007243ea4c047f000" }
