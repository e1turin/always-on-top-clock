[package]
name = "gpui-clock-widget"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "clock"
path = "src/bin/clock.rs"

[[bin]]
name = "vertical"
path = "src/bin/vertical.rs"

[[bin]]
name = "pomodoro"
path = "src/bin/pomodoro.rs"

[[bin]]
name = "stopwatch"
path = "src/bin/stopwatch.rs"

[features]
default = []
light-theme = []

[dependencies]
gpui = { path = "../zed/crates/gpui", features = ["font-kit"] }
gpui_platform = { path = "../zed/crates/gpui_platform", features = ["font-kit"] }
chrono = "0.4"
anyhow = "1.0"
gpui_shared_string = { path = "../zed/crates/gpui_shared_string" }
