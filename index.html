<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PiP Clock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a2e;
      color: #eee;
      font-family: -apple-system, Helvetica, system-ui, sans-serif;
    }
    #wrap {
      position: relative;
      width: 400px;
      height: 400px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #clock {
      display: block;
      border-radius: 12px;
      background: #000;
    }
    #pipVideo {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 12px;
      background: #000;
      display: none;
    }
    #controls {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }
    .mode-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-family: inherit;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      background: transparent;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
    }
    .mode-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
    .mode-btn.active { color: #fff; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }
    #pipBtn {
      margin-top: 16px;
      padding: 12px 32px;
      font-size: 16px;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: #fff;
      cursor: pointer;
    }
    #pipBtn:hover { background: #c73a52; }
    .pip-active { background: #16c784 !important; }
    .pip-active:hover { background: #13a86e !important; }
    #hint {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      display: none;
    }
    #timerControls {
      margin-top: 12px;
      display: none;
      gap: 10px;
    }
    .tc-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tc-btn:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="clock" width="400" height="400"></canvas>
    <video id="pipVideo" muted playsinline autoplay controls></video>
  </div>
  <div id="controls">
    <button class="mode-btn active" data-mode="clock">Clock</button>
    <button class="mode-btn" data-mode="vertical">Vertical</button>
    <button class="mode-btn" data-mode="pomodoro">Pomodoro</button>
  </div>
  <div id="timerControls">
    <button class="tc-btn" id="tcPlay" title="Play / Pause"></button>
    <button class="tc-btn" id="tcSkip" title="Skip"></button>
    <button class="tc-btn" id="tcReset" title="Reset"></button>
  </div>
  <button id="pipBtn">Start PiP</button>
  <p id="hint">Hover the clock and click the PiP icon</p>
  <script>
    var canvas = document.getElementById("clock");
    var ctx = canvas.getContext("2d");
    var btn = document.getElementById("pipBtn");
    var video = document.getElementById("pipVideo");
    var hint = document.getElementById("hint");
    var timerControlsEl = document.getElementById("timerControls");
    var tcPlay = document.getElementById("tcPlay");
    var tcReset = document.getElementById("tcReset");
    var pipActive = false;
    var stream = null;
    var currentMode = "clock";
    var FONT = "500 72px -apple-system, Helvetica, system-ui, sans-serif";
    var FONT_SM = "500 36px -apple-system, Helvetica, system-ui, sans-serif";
    var FONT_LG = "500 88px -apple-system, Helvetica, system-ui, sans-serif";
    var FONT_XL = "500 120px -apple-system, Helvetica, system-ui, sans-serif";
    var FONT_LABEL = "600 18px -apple-system, Helvetica, system-ui, sans-serif";
    tcPlay.textContent = "\u25B6";
    document.getElementById("tcSkip").textContent = "\u23ED";
    tcReset.textContent = "\u21BA";

    function clearCanvas() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, 400, 400);
    }

    function drawChars(str, font, charW, y) {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "transparent";
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#fff";
      ctx.font = font;
      var chars = str.split("");
      var totalW = chars.length * charW;
      var startX = (400 - totalW) / 2 + charW / 2;
      for (var i = 0; i < chars.length; i++) {
        ctx.fillText(chars[i], startX + i * charW, y);
      }
    }

    function drawClockMode() {
      var now = new Date();
      var hh = String(now.getHours()).padStart(2, "0");
      var mm = String(now.getMinutes()).padStart(2, "0");
      var ss = String(now.getSeconds()).padStart(2, "0");
      drawChars(hh + ":" + mm + ":" + ss, FONT, 42, 200);
    }

    function drawVerticalMode() {
      var now = new Date();
      var hh = String(now.getHours()).padStart(2, "0");
      var mm = String(now.getMinutes()).padStart(2, "0");
      drawChars(hh, FONT_XL, 84, 135);
      drawChars(mm, FONT_XL, 84, 275);
    }

    // ---- Pomodoro ----
    // Phases: 0=w1 1=b1 2=w2 3=b2 4=w3 5=b3 6=w4 7=longbreak
    var POMO_WORK = 25 * 60;
    var POMO_BREAK = 5 * 60;
    var POMO_LONG = 15 * 60;
    var pomoPhase = 0;
    var pomoRemaining = POMO_WORK;
    var pomoRunning = false;
    var pomoLastTick = 0;

    function pomoPhaseName() {
      if (pomoPhase === 7) return "LONG BREAK";
      if (pomoPhase % 2 === 1) return "BREAK";
      return "WORK";
    }

    function pomoPhaseDuration() {
      if (pomoPhase === 7) return POMO_LONG;
      if (pomoPhase % 2 === 1) return POMO_BREAK;
      return POMO_WORK;
    }

    function pomoAdvance() {
      pomoPhase++;
      if (pomoPhase > 7) pomoPhase = 0;
      pomoRemaining = pomoPhaseDuration();
    }

    function pomoCompletedSessions() {
      return Math.floor((pomoPhase + 1) / 2);
    }

    function drawPomodoroMode() {
      // tick the countdown
      if (pomoRunning) {
        var now = performance.now();
        var elapsed = (now - pomoLastTick) / 1000;
        pomoLastTick = now;
        pomoRemaining -= elapsed;
        if (pomoRemaining <= 0) {
          pomoRemaining = 0;
          pomoRunning = false;
          tcPlay.textContent = "\u25B6";
          pomoAdvance();
        }
      }

      var remaining = Math.max(0, pomoRemaining);
      var mins = String(Math.floor(remaining / 60)).padStart(2, "0");
      var secs = String(Math.floor(remaining % 60)).padStart(2, "0");

      // phase label
      drawChars(pomoPhaseName(), FONT_LABEL, 24, 110);

      // countdown
      drawChars(mins + ":" + secs, FONT_LG, 52, 195);

      // session dots
      var completed = Math.floor(pomoPhase / 2);
      if (pomoPhase === 7) completed = 4;
      var dotY = 280;
      var dotSpacing = 22;
      var totalDotsW = 4 * dotSpacing;
      var dotStartX = (400 - totalDotsW) / 2 + dotSpacing / 2;
      for (var i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.arc(dotStartX + i * dotSpacing, dotY, 4, 0, Math.PI * 2);
        ctx.fillStyle = i < completed ? "#fff" : "rgba(255,255,255,0.2)";
        ctx.fill();
      }
    }

    document.getElementById("tcPlay").addEventListener("click", function() {
      if (pomoRunning) {
        pomoRunning = false;
        tcPlay.textContent = "\u25B6";
      } else {
        pomoLastTick = performance.now();
        pomoRunning = true;
        tcPlay.textContent = "\u23F8";
      }
    });

    document.getElementById("tcSkip").addEventListener("click", function() {
      pomoRunning = false;
      tcPlay.textContent = "\u25B6";
      pomoAdvance();
    });

    tcReset.addEventListener("click", function() {
      pomoRunning = false;
      pomoPhase = 0;
      pomoRemaining = POMO_WORK;
      tcPlay.textContent = "\u25B6";
    });

    function loop() {
      clearCanvas();
      if (currentMode === "clock") drawClockMode();
      else if (currentMode === "vertical") drawVerticalMode();
      else if (currentMode === "pomodoro") drawPomodoroMode();
      requestAnimationFrame(loop);
    }
    loop();

    var modeBtns = document.querySelectorAll(".mode-btn");
    modeBtns.forEach(function(b) {
      b.addEventListener("click", function() {
        modeBtns.forEach(function(x) { x.classList.remove("active"); });
        b.classList.add("active");
        currentMode = b.getAttribute("data-mode");
        timerControlsEl.style.display = currentMode === "pomodoro" ? "flex" : "none";
      });
    });

    btn.addEventListener("click", function() {
      if (pipActive) { stopPiP(); return; }
      stream = canvas.captureStream(25);
      video.srcObject = stream;
      video.style.display = "block";
      function onReady() {
        video.play().then(function() {
          return video.requestPictureInPicture();
        }).then(function() {
          setPipActive();
        }).catch(function() {
          setPipActive();
          hint.style.display = "block";
        });
      }
      if (video.readyState >= 2) onReady();
      else {
        video.addEventListener("loadeddata", function handler() {
          video.removeEventListener("loadeddata", handler);
          onReady();
        });
        setTimeout(function() { if (!pipActive) onReady(); }, 1500);
      }
    });

    function setPipActive() {
      pipActive = true;
      btn.textContent = "Stop PiP";
      btn.classList.add("pip-active");
    }

    function stopPiP() {
      if (document.pictureInPictureElement) {
        document.exitPictureInPicture().catch(function() {});
      }
      if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
      video.srcObject = null;
      video.style.display = "none";
      pipActive = false;
      btn.textContent = "Start PiP";
      btn.classList.remove("pip-active");
      hint.style.display = "none";
    }

    video.addEventListener("enterpictureinpicture", function() { setPipActive(); });
    video.addEventListener("leavepictureinpicture", function() { stopPiP(); });
  </script>
</body>
</html>
